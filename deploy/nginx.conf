# /etc/nginx/sites-available/shopforge
# Serves the built React app as static files and reverse-proxies /api to
# uvicorn on 127.0.0.1:8000. Same origin for both, so no CORS config needed
# in the browser (FRONTEND_ORIGIN in backend/.env can stay as-is or be
# tightened to the instance's public IP).

server {
    listen 80;
    server_name _;  # raw IP, no domain -- replace with a domain name later if you get one

    # NOT the repo checkout under /home/ubuntu -- home directories are typically
    # 750 (owner+group only), so nginx's www-data user can't even traverse into
    # them ("Permission denied" on stat(), regardless of dist/'s own perms).
    # Copy the build output here instead: see deploy/README.md step 6.
    root /var/www/shopforge/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;  # Gemini calls can take several seconds
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
